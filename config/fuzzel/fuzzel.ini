# an4rch launcher and menus (fuzzel). Colours come from the active theme.
# Reference: man 5 fuzzel.ini

[main]
font=Inter:size=13,JetBrainsMono Nerd Font Propo:size=13
prompt="  "
placeholder=Search…
icons-enabled=yes
terminal=lumen-term --
launch-prefix=lumen-launch --
layer=overlay
anchor=center
width=38
lines=9
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=26
letter-spacing=0
image-size-ratio=0.5
match-mode=fzf
show-actions=yes
filter-desktop=yes
exit-on-keyboard-focus-loss=yes
# Theme colours (kept last in [main] so it can open its own sections).
include=~/.config/lumen/current/theme/fuzzel.ini

[border]
width=1
radius=16

[dmenu]
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
delete-line-forward=none
