# Lock screen (hyprlock). Colours come from the active An4rch theme.
# Reference: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

source = ~/.config/lumen/current/theme/hyprlock.conf

$font = Inter
$mono = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true
    fail_timeout       = 1500
}

auth {
    pam:enabled = true
    # Turned on by `anarch-setup fingerprint`.
    fingerprint:enabled = false
    fingerprint:ready_message   = Scan your finger to unlock
    fingerprint:present_message = Scanning…
}

animations {
    enabled = true
}

background {
    monitor     =
    path        = ~/.config/lumen/current/wallpaper
    color       = $bg
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    vibrancy    = 0.2
}

# Time
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = $fg
    font_size   = 112
    font_family = $font Light
    position    = 0, 190
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    color       = $fg_dim
    font_size   = 20
    font_family = $font
    position    = 0, 90
    halign      = center
    valign      = center
}

# Password
input-field {
    monitor           = 
    size              = 320, 54
    outline_thickness = 2
    rounding          = 16
    dots_size         = 0.22
    dots_spacing      = 0.4
    dots_center       = true
    inner_color       = $surface
    outer_color       = $accent $accent2 45deg
    check_color       = $accent2
    fail_color        = $red
    capslock_color    = $yellow
    font_color        = $fg
    font_family       = $font
    fade_on_empty     = false
    placeholder_text  = Password
    fail_text         = <i>$FAIL</i>
    position          = 0, -40
    halign            = center
    valign            = center
}

# Greeting
label {
    monitor     =
    text        = Welcome back, $USER
    color       = $fg_dim
    font_size   = 13
    font_family = $font
    position    = 0, -100
    halign      = center
    valign      = center
}

# Battery and keyboard layout, bottom right
label {
    monitor     =
    text        = cmd[update:30000] ~/.local/share/lumen/bin/anarch-session lock-status
    color       = $fg_dim
    font_size   = 12
    font_family = $mono
    position    = -32, 28
    halign      = right
    valign      = bottom
}
