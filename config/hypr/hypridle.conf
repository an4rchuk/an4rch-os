# Idle and sleep behaviour (hypridle).
# Pause it any time with SUPER + CTRL + I ("keep awake").
# Reference: https://wiki.hypr.land/hypr-ecosystem/user/hypridle/

general {
    lock_cmd         = pidof hyprlock || hyprlock          # one lock screen only
    before_sleep_cmd = loginctl lock-session              # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep    = 3                                  # wait for the lock screen before sleeping
}

# 2.5 min: dim the screen.
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 15%
    on-resume  = brightnessctl -r
}

# 2.5 min: keyboard backlight off.
listener {
    timeout    = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume  = brightnessctl -rd '*::kbd_backlight'
}

# 5 min: lock.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off.
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min: suspend, but only on battery or when nothing keeps the system busy.
listener {
    timeout         = 1800
    on-timeout      = systemctl suspend
    condition_cmd   = ~/.local/share/lumen/bin/lumen-session can-suspend
    condition_retry = 60
}
