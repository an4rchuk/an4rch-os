name: e2e

# End-to-end test of an4rch OS in a real virtual machine:
#   1. build the ISO
#   2. boot it in QEMU (UEFI, KVM) and run the installer unattended
#   3. boot the installed system, log in automatically and screenshot the
#      desktop, then tap the Windows key and screenshot the Start menu
# Screenshots and serial logs are attached to the run.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "VM set: standard (5), scenarios (14), brutal (20), features (installer choices), brand (boot screen, login, sizes) or retest"
        default: standard

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(jq -c . ".github/e2e/${{ inputs.set || 'standard' }}.json")" >>"$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.vm }})
    runs-on: ubuntu-24.04
    # A known issue being investigated still runs and reports, without turning the whole run red.
    continue-on-error: ${{ matrix.known_issue || false }}
    timeout-minutes: 300
    needs: plan
    strategy:
      fail-fast: false
      # The VMs: .github/e2e/<set>.json (standard: the 5 release VMs;
      # scenarios: 14 different people's computers and choices).
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VM_CPUS: ${{ matrix.cpus || 4 }}
      VM_MEM: ${{ matrix.mem || '8G' }}
      VM_XRES: ${{ matrix.xres || 1920 }}
      VM_YRES: ${{ matrix.yres || 1080 }}
      LIVE_APPEND: ${{ matrix.live || '' }}
      INSTALL_APPEND: ${{ matrix.install || '' }}
      WINDOWS: ${{ matrix.windows || false }}
      # No network while installing (everything from the USB stick).
      INSTALL_NIC: ${{ matrix.nonet && 'none' || 'user,model=virtio-net-pci' }}
      # Disk encryption: the password typed at the boot prompt.
      BOOT_PASS: ${{ matrix.bootpass || '' }}
      # Partitions made before installing (manual partitioning): simple or split.
      PREPART: ${{ matrix.prepart || '' }}
      # Stop at the login screen (no automatic login), screenshot it, log in.
      LOGIN: ${{ matrix.login || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the ISO (Arch container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e LUMEN_STRICT=1 archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso git python-pillow >/dev/null &&
            git config --global --add safe.directory /src &&
            cd /src && WORK=/tmp/lumen-iso OUT=/src/out iso/build.sh'
          sudo chown -R "$USER" out
          ls -lh out

      - name: Set up QEMU with KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf libarchive-tools socat python3-pil
          ls -l /dev/kvm

      # The USB's boot menus, as a computer shows them: UEFI (systemd-boot) and
      # legacy BIOS (syslinux, with the an4rch splash).
      - name: Screenshot the USB's boot menus
        if: matrix.menus
        continue-on-error: true
        run: |
          iso=$(ls out/an4rch-os-*.iso | head -n1)
          mkdir -p shots
          menu() { # menu NAME QEMU-ARGS...
            local name=$1; shift
            qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -m 2G "$@" \
              -drive file="$iso",media=cdrom,readonly=on -boot d \
              -vga none -device virtio-vga,xres=$VM_XRES,yres=$VM_YRES -display none \
              -monitor unix:menu.sock,server,nowait &
            local q=$!
            sleep 7
            echo "screendump $PWD/shots/$name.ppm" | socat - UNIX-CONNECT:menu.sock >/dev/null; sleep 2
            echo quit | socat - UNIX-CONNECT:menu.sock >/dev/null || true
            wait "$q" 2>/dev/null || true
            python3 -c "from PIL import Image; Image.open('shots/$name.ppm').save('shots/$name.png')" && rm -f "shots/$name.ppm"
          }
          cp /usr/share/OVMF/OVMF_VARS_4M.fd menu-vars.fd
          menu 00m-usb-menu-uefi -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=menu-vars.fd
          menu 00n-usb-menu-bios
          ls -l shots

      - name: Boot the live USB (desktop with the graphical installer)
        continue-on-error: true
        run: |
          iso=$(ls out/an4rch-os-*.iso | head -n1)
          label=$(blkid -o value -s LABEL "$iso")
          bsdtar -xf "$iso" arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          cp /usr/share/OVMF/OVMF_VARS_4M.fd live-vars.fd
          qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=live-vars.fd \
            -drive file="$iso",media=cdrom,readonly=on \
            -kernel arch/boot/x86_64/vmlinuz-linux -initrd arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$label console=tty0 console=ttyS0,115200 lumen.livecheck=1 $LIVE_APPEND" \
            -vga none -device virtio-vga,xres=$VM_XRES,yres=$VM_YRES \
            -nic user,model=virtio-net-pci -display none \
            -monitor unix:live.sock,server,nowait -serial file:live-serial.log &
          qpid=$!
          mon() { echo "$1" | socat - UNIX-CONNECT:live.sock >/dev/null; }
          shot() { mon "screendump $PWD/$1.ppm"; sleep 2; python3 -c "from PIL import Image; Image.open('$1.ppm').save('$1.png')" && rm -f "$1.ppm" || true; }
          mkdir -p shots
          sleep 90;  shot shots/00a-live-installer
          # anarch-live-check reports on the live desktop over serial (~100 s after boot).
          for _ in $(seq 60); do grep -aq LUMEN-LIVE-CHECK-END live-serial.log && break; sleep 3; done
          shot shots/00b-live-installer-later
          # Make sure this VM is gone before the install VM starts (memory).
          mon "quit" || true
          for _ in $(seq 10); do kill -0 "$qpid" 2>/dev/null || break; sleep 1; done
          kill -9 "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          tr -d '\r' <live-serial.log | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' >live-clean.log
          sed -n '/=== LUMEN-LIVE-CHECK ===/,/LUMEN-LIVE-CHECK-END/p' live-clean.log >live-check.log
          grep -a -o 'E2E-RESULT live: .*' live-check.log >live-results.txt || true
          [ -s live-results.txt ] || echo "E2E-RESULT live: report received FAIL (no LUMEN-LIVE-CHECK on serial)" >live-results.txt
          cat live-check.log

      - name: Install an4rch OS in a VM (unattended)
        run: |
          iso=$(ls out/an4rch-os-*.iso | head -n1)
          label=$(blkid -o value -s LABEL "$iso")
          bsdtar -xf "$iso" arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          if [ "$WINDOWS" = true ]; then
            # A disk laid out like a Windows laptop's: EFI partition with the
            # Windows boot manager, Microsoft reserved, an NTFS C: drive with
            # files (checksummed, to prove they survive) and a recovery partition.
            sudo apt-get install -y -q gdisk ntfs-3g dosfstools >/dev/null
            truncate -s 90G win.raw
            sgdisk -n1:0:+100M -t1:ef00 -c1:"EFI system partition" -n2:0:+16M -t2:0c01 -c2:"Microsoft reserved partition" \
              -n3:0:-700M -t3:0700 -c3:"Basic data partition" -n4:0:0 -t4:2700 -c4:"Windows RE" win.raw
            loop=$(sudo losetup -fP --show win.raw)
            sudo mkfs.fat -F32 -n SYSTEM "${loop}p1" >/dev/null
            sudo mkntfs -Q -L Windows "${loop}p3" >/dev/null
            sudo mkntfs -Q -L WinRE "${loop}p4" >/dev/null
            sudo mkdir -p /mnt/esp /mnt/c
            sudo mount "${loop}p1" /mnt/esp
            sudo mkdir -p /mnt/esp/EFI/Microsoft/Boot /mnt/esp/EFI/Boot
            head -c 1500000 /dev/urandom | sudo tee /mnt/esp/EFI/Microsoft/Boot/bootmgfw.efi >/dev/null
            sudo cp /mnt/esp/EFI/Microsoft/Boot/bootmgfw.efi /mnt/esp/EFI/Boot/bootx64.efi
            sudo umount /mnt/esp
            sudo mount -t ntfs-3g "${loop}p3" /mnt/c
            sudo mkdir -p /mnt/c/Windows/System32 "/mnt/c/Users/Student/Documents" "/mnt/c/Program Files/App"
            for i in $(seq 1 400); do head -c $((RANDOM * 8)) /dev/urandom | sudo tee "/mnt/c/Users/Student/Documents/file $i.txt" >/dev/null; done
            sudo dd if=/dev/urandom of=/mnt/c/Windows/System32/big.bin bs=1M count=3000 status=none
            sudo dd if=/dev/urandom of="/mnt/c/Program Files/App/app.bin" bs=1M count=500 status=none
            (cd /mnt/c && sudo find . -type f -print0 | sudo xargs -0 sha256sum) >win-files.sha256
            sudo umount /mnt/c
            sudo sgdisk -i 3 "$loop" | grep -i 'unique guid' >win-part-guid.txt
            sudo losetup -d "$loop"
            echo "Windows-style disk: $(wc -l <win-files.sha256) files"
            qemu-img convert -O qcow2 win.raw disk.qcow2 && rm -f win.raw
          elif [ -n "$PREPART" ]; then
            # Partitions made beforehand, as for "use partitions I've made myself":
            # simple: a 1 GB EFI partition and one for an4rch; split: a small
            # EFI partition that already holds another system's boot files, a
            # 1 GB boot partition and one for an4rch.
            sudo apt-get install -y -q gdisk dosfstools >/dev/null
            truncate -s 40G man.raw
            if [ "$PREPART" = split ]; then
              sgdisk -n1:0:+300M -t1:ef00 -c1:"EFI system partition" -n2:0:+1G -t2:8300 -c2:boot -n3:0:0 -t3:8300 -c3:linux man.raw
              # Formatted on the partition itself, like a real disk: written
              # into the image file at an offset, firmware didn't recognise it.
              loop=$(sudo losetup -fP --show man.raw)
              sudo mkfs.fat -F32 -n SYSTEM "${loop}p1" >/dev/null
              sudo mkdir -p /mnt/esp && sudo mount "${loop}p1" /mnt/esp
              sudo mkdir -p /mnt/esp/EFI/Other
              echo other-boot-loader | sudo tee /mnt/esp/EFI/Other/other.efi >/dev/null
              sudo umount /mnt/esp
              sudo losetup -d "$loop"
            else
              sgdisk -n1:0:+1G -t1:ef00 -c1:"EFI system partition" -n2:0:0 -t2:8300 -c2:linux man.raw
            fi
            sgdisk -p man.raw
            qemu-img convert -O qcow2 man.raw disk.qcow2 && rm -f man.raw
          else
            qemu-img create -f qcow2 disk.qcow2 40G
          fi
          timeout 150m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file="$iso",media=cdrom,readonly=on \
            -kernel arch/boot/x86_64/vmlinuz-linux -initrd arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$label console=tty0 console=ttyS0,115200 lumen.auto=1 lumen.disk=/dev/vda lumen.user=lumen lumen.pass=lumen lumen.autologin=$([ "$LOGIN" = true ] && echo 0 || echo 1) lumen.poweroff=1 lumen.serial=1 $INSTALL_APPEND" \
            -vga none -device virtio-vga,xres=$VM_XRES,yres=$VM_YRES \
            -nic $INSTALL_NIC -display none -serial file:install-serial.log -no-reboot || true
          # The installer's own output, without systemd's boot/shutdown chatter.
          sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g; s/\x1b\][^\x1b]*\x1b\\//g' install-serial.log |
            grep -av -E '^\s*(\[ *OK *\]|\[ *FAILED *\]|Starting|Stopping|Unmounting|Mounting|Mounted|Stopped|Started|Reached|Closed|Finished|Listening|Created slice|Removed slice)' |
            grep -av '^\s*$' > install-clean.log || true
          if grep -q LUMEN-INSTALL-FAILED install-clean.log; then
            sed -n '/LUMEN-INSTALL-FAILED/,$p' install-clean.log | head -n 260
          else
            tail -n 200 install-clean.log
          fi
          grep -q LUMEN-INSTALL-OK install-serial.log

      - name: Check Windows survived (dual boot)
        if: env.WINDOWS == 'true'
        run: |
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only -c /dev/nbd0 disk.qcow2 && sleep 2
          sudo sgdisk -p /dev/nbd0
          r() { echo "E2E-RESULT dual-boot: $1 $2 ${3:-}" | tee -a dualboot-results.txt; }
          if sudo sgdisk -i 3 /dev/nbd0 | grep -i 'unique guid' | diff -q - win-part-guid.txt >/dev/null; then r "Windows partition kept its identity" PASS; else r "Windows partition kept its identity" FAIL; fi
          sudo mkdir -p /mnt/c /mnt/esp
          if sudo ntfsfix -n /dev/nbd0p3 && sudo mount -t ntfs-3g -o ro /dev/nbd0p3 /mnt/c; then
            r "Windows drive mounts" PASS "$(df -h /mnt/c | tail -n1 | awk '{print $2" total, "$3" used"}')"
            if (cd /mnt/c && sha256sum --quiet -c "$GITHUB_WORKSPACE/win-files.sha256"); then r "all Windows files intact" PASS "$(wc -l <win-files.sha256) files"; else r "all Windows files intact" FAIL; fi
            sudo umount /mnt/c
          else
            r "Windows drive mounts" FAIL
          fi
          sudo mount -o ro /dev/nbd0p1 /mnt/esp
          ls -R /mnt/esp | head -n 40
          if [ -f /mnt/esp/EFI/Microsoft/Boot/bootmgfw.efi ]; then r "Windows boot manager still there" PASS; else r "Windows boot manager still there" FAIL; fi
          if [ -f /mnt/esp/EFI/systemd/systemd-bootx64.efi ]; then r "an4rch boot menu on the EFI partition" PASS; else r "an4rch boot menu on the EFI partition" FAIL; fi
          sudo umount /mnt/esp
          sudo qemu-nbd -d /dev/nbd0

      - name: Check the partitions made beforehand (manual partitioning)
        if: env.PREPART == 'split'
        run: |
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only -c /dev/nbd0 disk.qcow2 && sleep 2
          sudo sgdisk -p /dev/nbd0
          r() { echo "E2E-RESULT manual: $1 $2 ${3:-}" | tee -a manual-results.txt; }
          sudo mkdir -p /mnt/esp /mnt/xboot
          sudo mount -o ro /dev/nbd0p1 /mnt/esp && sudo mount -o ro /dev/nbd0p2 /mnt/xboot
          ls -R /mnt/esp | head -n 30
          if [ -f /mnt/esp/EFI/Other/other.efi ]; then r "other system's boot files kept" PASS; else r "other system's boot files kept" FAIL; fi
          if [ -f /mnt/esp/EFI/systemd/systemd-bootx64.efi ]; then r "boot menu on the EFI partition" PASS; else r "boot menu on the EFI partition" FAIL; fi
          if ls /mnt/xboot/vmlinuz-* >/dev/null 2>&1; then r "kernels on the boot partition" PASS "$(ls /mnt/xboot | tr '\n' ' ')"; else r "kernels on the boot partition" FAIL; fi
          sudo umount /mnt/esp /mnt/xboot
          sudo qemu-nbd -d /dev/nbd0

      - name: Boot the installed system and take screenshots
        if: always()
        run: |
          [ -f disk.qcow2 ] || exit 1
          grep -q LUMEN-INSTALL-OK install-serial.log || { echo "::error::The install didn't finish; nothing to boot"; exit 1; }
          # Fresh firmware memory, without the boot entry the installer made:
          # like laptops that forget or ignore it, the disk must still start
          # (from the fallback path, EFI/BOOT/BOOTX64.EFI).
          cp /usr/share/OVMF/OVMF_VARS_4M.fd boot-vars.fd
          qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=boot-vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -vga none -device virtio-vga,xres=$VM_XRES,yres=$VM_YRES \
            -nic user,model=virtio-net-pci -display none -device qemu-xhci -device usb-tablet \
            -monitor unix:mon.sock,server,nowait -qmp unix:qmp.sock,server,nowait -serial file:boot-serial.log &
          mon() { echo "$1" | socat - UNIX-CONNECT:mon.sock >/dev/null; }
          shot() { mon "screendump $PWD/$1.ppm"; sleep 2; python3 -c "from PIL import Image; Image.open('$1.ppm').save('$1.png')" && rm -f "$1.ppm" || true; }
          # click X Y: a left click at a screen position (the USB tablet takes
          # absolute positions, 0-32767 across the screen, through QMP).
          qmp() { printf '{"execute":"qmp_capabilities"}\n%s\n' "$1" | socat -t 2 - UNIX-CONNECT:qmp.sock >/dev/null; }
          click() {
            local x=$(($1 * 32767 / VM_XRES)) y=$(($2 * 32767 / VM_YRES))
            qmp '{"execute":"input-send-event","arguments":{"events":[{"type":"abs","data":{"axis":"x","value":'$x'}},{"type":"abs","data":{"axis":"y","value":'$y'}}]}}'
            sleep 0.5
            qmp '{"execute":"input-send-event","arguments":{"events":[{"type":"btn","data":{"down":true,"button":"left"}}]}}'
            sleep 0.2
            qmp '{"execute":"input-send-event","arguments":{"events":[{"type":"btn","data":{"down":false,"button":"left"}}]}}'
          }
          type_text() {
            local s="$1" i c k
            for ((i = 0; i < ${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [a-z0-9]) k="$c" ;; ' ') k=spc ;; '-') k=minus ;; '.') k=dot ;; '/') k=slash ;; *) continue ;;
              esac
              mon "sendkey $k"; sleep 0.15
            done
          }
          mkdir -p shots
          # The boot screen, as it plays: a quick picture every 1.5 s (just the
          # raw dump now; converted afterwards so the timing stays even).
          if [ "$WINDOWS" != true ]; then
            for i in $(seq -w 1 14); do sleep 1.5; mon "screendump $PWD/shots/00e-boot-$i.ppm"; done
            for f in shots/00e-boot-*.ppm; do python3 -c "from PIL import Image; Image.open('$f').save('${f%.ppm}.png')" && rm -f "$f"; done
          fi
          if [ "$WINDOWS" = true ]; then sleep 4; shot shots/00c-boot-menu; fi
          # Encrypted disk: unlock it at the boot prompt.
          if [ -n "$BOOT_PASS" ]; then
            sleep 25; shot shots/00d-unlock
            type_text "$BOOT_PASS"; mon "sendkey ret"
          fi
          # First login: desktop with the welcome tour, Start (Windows-key tap)
          # and the App Store (Windows + A).
          if [ "$LOGIN" = true ]; then
            # The login screen: the logo where the boot screen left it. Log in.
            sleep 35; shot shots/01a-login
            # The user name is filled in and the password box has the cursor:
            # type the password and press Enter, as a person would.
            type_text lumen; sleep 1; shot shots/01b-login-password
            mon "sendkey ret"
          fi
          sleep 45;  shot shots/01-boot
          sleep 95;  shot shots/02-desktop
          mon "sendkey meta_l"; sleep 6; shot shots/03-start-menu
          mon "sendkey esc"; sleep 2
          mon "sendkey meta_l-a"; sleep 30; shot shots/04-app-store

          # Then tests/vm/tasks.sh (inside the VM) drives the rest: it asks for
          # screenshots, key presses and typing on the serial console.
          seen=0 deadline=$((SECONDS + 1500))
          while ((SECONDS < deadline)); do
            mapfile -t ev < <(tr -d '\r' <boot-serial.log | grep -a -o 'E2E-\(SHOT\|KEYS\|TYPE\|DONE\).*')
            while ((seen < ${#ev[@]})); do
              e="${ev[$seen]}"; seen=$((seen + 1))
              case "$e" in
                E2E-SHOT\ *) sleep 3; shot "shots/${e#E2E-SHOT }" ;;
                E2E-KEYS\ *) for k in ${e#E2E-KEYS }; do mon "sendkey $k"; sleep 0.4; done ;;
                E2E-TYPE\ *) type_text "${e#E2E-TYPE }" ;;
                E2E-DONE*) break 2 ;;
              esac
            done
            sleep 1
          done
          mon "quit" || true
          ls -l shots
          strip() { tr -d '\r' <boot-serial.log | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'; }
          echo "--- installed system's report ---"
          strip | sed -n '/=== LUMEN-E2E-REPORT ===/,/LUMEN-E2E-REPORT-END/p' | head -n 400 || true
          strip | sed -n '/=== LUMEN-E2E-TASKS/,/E2E-DONE/p' | grep -v '^E2E-\(SHOT\|KEYS\|TYPE\)' > tasks.log || true
          strip | grep -a -o 'E2E-RESULT.*' > results.txt || true
          cat live-results.txt >> results.txt 2>/dev/null || true
          cat dualboot-results.txt >> results.txt 2>/dev/null || true
          cat manual-results.txt >> results.txt 2>/dev/null || true

      # Older computers, and USB sticks started in legacy/CSM mode, boot with
      # BIOS (SeaBIOS here): install, then start the installed disk.
      - name: Install and boot with legacy BIOS
        if: always() && matrix.bios
        run: |
          iso=$(ls out/an4rch-os-*.iso | head -n1)
          [ -f "$iso" ] || exit 0
          label=$(blkid -o value -s LABEL "$iso")
          qemu-img create -f qcow2 bios.qcow2 40G
          timeout 40m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive file=bios.qcow2,if=virtio,format=qcow2 \
            -drive file="$iso",media=cdrom,readonly=on \
            -kernel arch/boot/x86_64/vmlinuz-linux -initrd arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$label console=tty0 console=ttyS0,115200 lumen.auto=1 lumen.disk=/dev/vda lumen.user=lumen lumen.pass=lumen lumen.autologin=1 lumen.poweroff=1 lumen.serial=1" \
            -nic user,model=virtio-net-pci -display none -serial file:bios-install.log -no-reboot >bios-qemu.log 2>&1 || true
          if grep -q LUMEN-INSTALL-OK bios-install.log; then
            echo "E2E-RESULT bios: install PASS" >>results.txt
          else
            echo "E2E-RESULT bios: install FAIL" >>results.txt
            { echo "qemu: $(tail -n 5 bios-qemu.log)"; echo "serial log: $(wc -c <bios-install.log 2>/dev/null) bytes"; } >bios-summary.txt
            sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' bios-install.log | grep -av '^\s*$' |
              grep -av -E '^\s*(\[ *OK *\]|Starting|Stopping|Mounted|Started|Reached|Finished|Stopped|Unmounting|Mounting|Listening|Closed)' |
              tail -n 120 >>bios-summary.txt
            exit 0
          fi
          timeout 6m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive file=bios.qcow2,if=virtio,format=qcow2 \
            -nic user,model=virtio-net-pci -display none -serial file:bios-boot.log &
          for i in $(seq 72); do
            grep -aq 'LUMEN-E2E-REPORT\|login:' bios-boot.log 2>/dev/null && break
            sleep 5
          done
          if grep -aq 'LUMEN-E2E-REPORT\|login:' bios-boot.log; then
            echo "E2E-RESULT bios: installed system boots PASS" >>results.txt
          else
            echo "E2E-RESULT bios: installed system boots FAIL" >>results.txt
            tr -d '\r' <bios-boot.log | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | grep -av '^\s*$' | tail -n 60 >bios-summary.txt
          fi
          pkill -f bios.qcow2 || true

      # The screenshots, downscaled, as base64 text in this log, so they can be
      # read through the job-log API where artifact downloads aren't possible.
      - name: Print screenshots as text
        if: always()
        run: |
          # Live USB, boot and login shots last, then the desktop shots the README
          # uses: the job-log API only returns the log's tail.
          readme='/(10-clean-desktop|12-theme-|16-start-search|18-store-search|20-browser|21b-hub-backups)'
          for f in $(ls shots/*.png | grep -v '/00\|/01[ab]' | grep -Ev "$readme") $(ls shots/*.png | grep '/00') $(ls shots/*.png | grep '/01[ab]') $(ls shots/*.png | grep -E "$readme"); do
            [ -f "$f" ] || continue
            python3 -c "from PIL import Image; im=Image.open('$f').convert('RGB'); im.thumbnail((1280,720)); im.save('/tmp/s.jpg', quality=60)"
            echo "=== SHOT $(basename "$f" .png) ==="
            base64 -w 120 /tmp/s.jpg
            echo "=== END ==="
          done

      - name: Task results
        if: always()
        run: |
          if [ -s bios-summary.txt ]; then echo "--- legacy BIOS run (end) ---"; cat bios-summary.txt; fi
          echo "--- live USB check ---"; cat live-check.log 2>/dev/null || true
          if ! grep -q LUMEN-LIVE-CHECK-END live-check.log 2>/dev/null; then
            echo "--- live USB boot console (end) ---"
            grep -av '^\s*$' live-clean.log 2>/dev/null | tail -n 80 || true
          fi
          echo "--- tasks ---"; head -n 800 tasks.log || true
          # The installed system never reported back: show how far it got.
          if ! grep -q E2E-DONE tasks.log 2>/dev/null; then
            echo "--- installed system boot console (end) ---"
            tr -d '\r' <boot-serial.log 2>/dev/null | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | grep -av '^\s*$' | tail -n 120 || true
          fi
          # Live USB and partition checks passing isn't enough: the installed
          # system has to boot and run its tasks.
          grep -q E2E-DONE tasks.log 2>/dev/null || echo "E2E-RESULT installed system booted and ran its tasks FAIL" >>results.txt
          echo
          [ -s results.txt ] || { echo "::error::No task results (the task runner never reported)"; exit 1; }
          sed -e 's/^E2E-RESULT //' results.txt | awk '{ s=($0 ~ / PASS/)?"✓":"✗"; print "  " s " " $0 }'
          if grep -q ' FAIL' results.txt; then
            grep ' FAIL' results.txt | sed 's/^E2E-RESULT /::error::/'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.vm }}
          path: |
            shots/*.png
            install-serial.log
            install-clean.log
            results.txt
            tasks.log
            boot-serial.log
            live-clean.log
