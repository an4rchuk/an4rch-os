name: e2e

# End-to-end test of Lumen OS in a real virtual machine:
#   1. build the ISO
#   2. boot it in QEMU (UEFI, KVM) and run the installer unattended
#   3. boot the installed system, log in automatically and screenshot the
#      desktop, then tap the Windows key and screenshot the Start menu
# Screenshots and serial logs are attached to the run.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the ISO (Arch container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso git >/dev/null &&
            git config --global --add safe.directory /src &&
            cd /src && WORK=/tmp/lumen-iso OUT=/src/out iso/build.sh'
          sudo chown -R "$USER" out
          ls -lh out

      - name: Set up QEMU with KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf libarchive-tools socat python3-pil
          ls -l /dev/kvm

      - name: Install Lumen OS in a VM (unattended)
        run: |
          iso=$(ls out/lumen-*.iso | head -n1)
          label=$(blkid -o value -s LABEL "$iso")
          bsdtar -xf "$iso" arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-img create -f qcow2 disk.qcow2 40G
          timeout 150m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 8G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file="$iso",media=cdrom,readonly=on \
            -kernel arch/boot/x86_64/vmlinuz-linux -initrd arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$label console=tty0 console=ttyS0,115200 lumen.auto=1 lumen.disk=/dev/vda lumen.user=lumen lumen.pass=lumen lumen.autologin=1 lumen.poweroff=1 lumen.serial=1" \
            -nic user,model=virtio-net-pci -display none -serial file:install-serial.log -no-reboot || true
          # The installer's own output, without systemd's boot/shutdown chatter.
          sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g; s/\x1b\][^\x1b]*\x1b\\//g' install-serial.log |
            grep -av -E '^\s*(\[ *OK *\]|\[ *FAILED *\]|Starting|Stopping|Unmounting|Mounting|Mounted|Stopped|Started|Reached|Closed|Finished|Listening|Created slice|Removed slice)' |
            grep -av '^\s*$' > install-clean.log || true
          if grep -q LUMEN-INSTALL-FAILED install-clean.log; then
            sed -n '/LUMEN-INSTALL-FAILED/,$p' install-clean.log | head -n 260
          else
            tail -n 200 install-clean.log
          fi
          grep -q LUMEN-INSTALL-OK install-serial.log

      - name: Boot the installed system and take screenshots
        if: always()
        run: |
          [ -f disk.qcow2 ] || exit 1
          qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 8G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -vga none -device virtio-vga,xres=1920,yres=1080 \
            -nic user,model=virtio-net-pci -display none \
            -monitor unix:mon.sock,server,nowait -serial file:boot-serial.log &
          mon() { echo "$1" | socat - UNIX-CONNECT:mon.sock >/dev/null; }
          shot() { mon "screendump $PWD/$1.ppm"; sleep 2; python3 -c "from PIL import Image; Image.open('$1.ppm').save('$1.png')" && rm -f "$1.ppm" || true; }
          type_text() {
            local s="$1" i c k
            for ((i = 0; i < ${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [a-z0-9]) k="$c" ;; ' ') k=spc ;; '-') k=minus ;; '.') k=dot ;; '/') k=slash ;; *) continue ;;
              esac
              mon "sendkey $k"; sleep 0.15
            done
          }
          mkdir -p shots
          # First login: desktop with the welcome tour, Start (Windows-key tap)
          # and the App Store (Windows + A).
          sleep 45;  shot shots/01-boot
          sleep 95;  shot shots/02-desktop
          mon "sendkey meta_l"; sleep 6; shot shots/03-start-menu
          mon "sendkey esc"; sleep 2
          mon "sendkey meta_l-a"; sleep 30; shot shots/04-app-store

          # Then tests/vm/tasks.sh (inside the VM) drives the rest: it asks for
          # screenshots, key presses and typing on the serial console.
          seen=0 deadline=$((SECONDS + 1500))
          while ((SECONDS < deadline)); do
            mapfile -t ev < <(tr -d '\r' <boot-serial.log | grep -a -o 'E2E-\(SHOT\|KEYS\|TYPE\|DONE\).*')
            while ((seen < ${#ev[@]})); do
              e="${ev[$seen]}"; seen=$((seen + 1))
              case "$e" in
                E2E-SHOT\ *) sleep 3; shot "shots/${e#E2E-SHOT }" ;;
                E2E-KEYS\ *) for k in ${e#E2E-KEYS }; do mon "sendkey $k"; sleep 0.4; done ;;
                E2E-TYPE\ *) type_text "${e#E2E-TYPE }" ;;
                E2E-DONE*) break 2 ;;
              esac
            done
            sleep 1
          done
          mon "quit" || true
          ls -l shots
          strip() { tr -d '\r' <boot-serial.log | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'; }
          echo "--- installed system's report ---"
          strip | sed -n '/=== LUMEN-E2E-REPORT ===/,/LUMEN-E2E-REPORT-END/p' | head -n 400 || true
          echo "--- tasks ---"
          strip | sed -n '/=== LUMEN-E2E-TASKS/,/E2E-DONE/p' | grep -v '^E2E-\(SHOT\|KEYS\|TYPE\)' | head -n 800 || true
          strip | grep -a -o 'E2E-RESULT.*' > results.txt || true

      - name: Task results
        if: always()
        run: |
          [ -s results.txt ] || { echo "::error::No task results (the task runner never reported)"; exit 1; }
          sed -e 's/^E2E-RESULT //' results.txt | awk '{ s=($0 ~ / PASS/)?"✓":"✗"; print "  " s " " $0 }'
          if grep -q ' FAIL' results.txt; then
            grep ' FAIL' results.txt | sed 's/^E2E-RESULT /::error::/'
            exit 1
          fi

      # The screenshots, downscaled, as base64 text in this log, so they can be
      # read through the job-log API where artifact downloads aren't possible.
      - name: Print screenshots as text
        if: always()
        run: |
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            python3 -c "from PIL import Image; im=Image.open('$f').convert('RGB'); im.thumbnail((1280,720)); im.save('/tmp/s.jpg', quality=60)"
            echo "=== SHOT $(basename "$f" .png) ==="
            base64 -w 120 /tmp/s.jpg
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            shots/*.png
            install-serial.log
            install-clean.log
            results.txt
            boot-serial.log
