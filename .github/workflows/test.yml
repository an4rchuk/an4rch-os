name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4 shellcheck jq python3-pil python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 papirus-icon-theme
      - name: Run tests
        run: tests/run.sh
      - name: Key bindings doc is up to date
        run: |
          lua5.4 tests/gen-keys-doc.lua . > /tmp/keys.md
          diff -u docs/02-keybindings.md /tmp/keys.md
