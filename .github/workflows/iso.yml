name: iso

# Builds the Lumen OS installer ISO in an Arch Linux container.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to
# also publish the ISO as a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ISO carries every package an install needs (iso/offline.sh), so
      # the build needs more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the ISO (Arch container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e LUMEN_STRICT=1 archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso git python-pillow >/dev/null &&
            git config --global --add safe.directory /src &&
            cd /src && WORK=/tmp/lumen-iso OUT=/src/out iso/build.sh'
          sudo chown -R "$USER" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-os-iso
          path: out/lumen-*.iso*
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/lumen-*.iso*
