name: iso

# Builds the Lumen OS installer ISO in an Arch Linux container.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to
# also publish a release (or type a tag in "Run workflow"). Release files are limited to 2 GB each, so a
# release carries the full ISO in parts (to join after downloading) plus a
# small single-file ISO that downloads its packages while installing.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this tag (e.g. v1.0.0); empty: just build"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write # publishing releases

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The release tag: the pushed tag, or the one typed when running it by hand.
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
      # Releases also put the full ISO, as one file, on Hugging Face (no
      # 2 GB limit there): a dataset repo, twil09/lumen-os unless the HF_REPO
      # variable names another. Skipped without the HF_TOKEN secret.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ${{ vars.HF_REPO || 'twil09/lumen-os' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ISO carries every package an install needs (iso/offline.sh), so
      # the build needs more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the ISO (Arch container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e LUMEN_STRICT=1 archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso git python-pillow >/dev/null &&
            git config --global --add safe.directory /src &&
            cd /src && WORK=/tmp/lumen-iso OUT=/src/out iso/build.sh'
          sudo chown -R "$USER" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-os-iso
          path: out/lumen-*.iso*
          compression-level: 0
          retention-days: 14

      - name: Build the small online ISO (releases)
        if: env.TAG != ''
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e LUMEN_OFFLINE=0 archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso git python-pillow >/dev/null &&
            git config --global --add safe.directory /src &&
            cd /src && WORK=/tmp/lumen-iso OUT=/src/out-online iso/build.sh'
          sudo chown -R "$USER" out-online
          ls -lh out-online

      - name: Upload the full ISO to Hugging Face (releases)
        if: env.TAG != '' && env.HF_TOKEN != ''
        run: |
          python3 -m venv /tmp/hf && /tmp/hf/bin/pip install -q huggingface_hub
          full=$(ls out/lumen-*.iso | head -n1)
          /tmp/hf/bin/python - "$full" <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          iso = sys.argv[1]
          name, repo, tag = os.path.basename(iso), os.environ["HF_REPO"], os.environ["TAG"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          for path in (iso, iso + ".sha256"):
              api.upload_file(path_or_fileobj=path, path_in_repo=f"{tag}/{os.path.basename(path)}",
                              repo_id=repo, repo_type="dataset", commit_message=f"Lumen OS {tag}")
          url = f"https://huggingface.co/datasets/{repo}/resolve/main/{tag}/{name}"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"HF_URL={url}\n")
          print("Uploaded:", url)
          PY

      - name: Prepare release files
        if: env.TAG != ''
        run: |
          mkdir release
          full=$(ls out/lumen-*.iso | head -n1)
          name=$(basename "$full" .iso)
          # The full ISO in parts under GitHub's 2 GB limit per file.
          split -b 1900M -d -a 1 "$full" "release/$name.iso.part"
          (cd out && sha256sum "$name.iso") >"release/$name.iso.sha256"
          online=$(ls out-online/lumen-*.iso | head -n1)
          if [ "$(stat -c %s "$online")" -lt 2000000000 ]; then
            cp "$online" "release/$name-online.iso"
            (cd release && sha256sum "$name-online.iso" >"$name-online.iso.sha256")
          else
            echo "::warning::The online ISO is over 2 GB; leaving it out of the release"
          fi
          parts=$(cd release && ls "$name".iso.part* | tr '\n' ' ')
          win_join=$(cd release && ls "$name".iso.part* | sed ':a;N;$!ba;s/\n/ + /g')
          {
          if [ -n "${HF_URL:-}" ]; then
            cat <<EOF
          ## Download

          **[⬇ ${name}.iso](${HF_URL})**: the full ISO as one file (about 5 GB, hosted on Hugging Face because GitHub limits release files to 2 GB). It installs in minutes from the USB stick. Checksum: [${name}.iso.sha256](${HF_URL}.sha256).

          The same ISO is also attached below in parts, as a backup: download every \`.part\` file and join them (see below).

          ### Joining the parts (backup download)
          EOF
          else
            echo "## Download"
          fi
          cat <<EOF

          **Full ISO (recommended): installs in minutes from the USB stick.** Download all of: \`${parts% }\`, then join them into one file:

          - **Windows** (Command Prompt, in the download folder): \`copy /b ${win_join} ${name}.iso\`
          - **Linux / macOS:** \`cat ${name}.iso.part* > ${name}.iso\`

          Check it against \`${name}.iso.sha256\` if you like (\`certutil -hashfile ${name}.iso SHA256\` on Windows, \`sha256sum -c\` elsewhere).

          **Online ISO (\`${name}-online.iso\`, if listed): one smaller file**, but it downloads the packages while installing, so installing takes longer.

          ## Install

          Write the ISO to a USB stick of 8 GB or more (Rufus in DD mode, Ventoy, Impression, Fedora Media Writer or \`dd\`), turn off Secure Boot, and boot it (UEFI recommended; older legacy BIOS computers work too). Pick **Lumen OS installer** for the live desktop with the graphical installer, or **(text mode)** for the console installer.

          > ⚠️ **Installing erases the entire disk you choose, including Windows and all files on it.** Lumen doesn't install alongside another system yet. To just try Lumen, use the live desktop and don't install: nothing on the computer is touched.

          See the [Lumen OS manual](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/09-lumen-os.md).
          EOF
          } >notes.md
          sed -i 's/^          //' notes.md
          ls -lh release

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Lumen OS ${{ env.TAG }}
          body_path: notes.md
          files: release/*
