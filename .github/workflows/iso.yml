name: iso

# Builds the Lumen OS installer ISO in an Arch Linux container.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to
# also publish the ISO as a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the ISO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          WORK=/tmp/lumen-iso iso/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-os-iso
          path: out/lumen-*.iso*
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/lumen-*.iso*
