name: install-test

# Runs the an4rch desktop installer the way the an4rch OS ISO does: inside an
# Arch Linux root that isn't booted (no running systemd), as a normal user
# with sudo, fully unattended. Catches missing packages and steps that only
# work on a running system.
on:
  workflow_dispatch:
  push:
    paths:
      - install.sh
      - install/**
      - bin/lumen-gaming
      - bin/lumen-tune
      - bin/lumen-extras
      - bin/lumen-dev
      - lib/**
      - .github/workflows/install-test.yml

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Prepare Arch
        run: |
          pacman -Syu --noconfirm --needed git sudo base-devel pciutils
          useradd -m -G wheel -s /bin/bash lumen
          # The same sudo rules the ISO installer leaves in place during the install.
          echo '%wheel ALL=(ALL:ALL) ALL' >/etc/sudoers.d/10-wheel
          printf 'Defaults:lumen verifypw=any, listpw=any\nlumen ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/99-lumen-install
          chmod 440 /etc/sudoers.d/*

      - uses: actions/checkout@v4

      - name: Check every package name against the Arch repos and AUR
        run: |
          bash install/enable-multilib.sh
          pacman -Slq | sort -u >/tmp/repo-pkgs
          bash -c 'source install/packages.sh
            for v in $(compgen -A variable PKGS_) PKG_FOR; do
              declare -n arr=$v
              printf "%s\n" "${arr[@]}"
            done' | sort -u >/tmp/wanted
          comm -23 /tmp/wanted /tmp/repo-pkgs >/tmp/not-in-repos
          echo "Not in the official repos (should be AUR packages):"
          missing=0
          while read -r p; do
            if curl -fsS "https://aur.archlinux.org/rpc/v5/info?arg[]=$p" | grep -q '"resultcount":1'; then
              echo "  AUR: $p"
            else
              echo "::error::Package '$p' exists neither in the repos nor in the AUR"
              missing=1
            fi
          done </tmp/not-in-repos
          exit $missing

      - name: Copy an4rch into the user's home
        run: |
          mkdir -p /home/lumen/.local/share
          cp -a "$GITHUB_WORKSPACE" /home/lumen/.local/share/lumen
          chown -R lumen:lumen /home/lumen

      - name: Run the installer (unattended, as the ISO does)
        run: |
          sudo -u lumen env HOME=/home/lumen USER=lumen LUMEN_YES=1 LUMEN_VERBOSE=1 \
            bash /home/lumen/.local/share/lumen/install.sh --yes --distro --gaming --no-reboot \
            --browser firefox --terminal ghostty --editor code

      - name: Show the end of the install log
        if: always()
        run: tail -n 80 /home/lumen/.local/state/lumen/install.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-log
          path: /home/lumen/.local/state/lumen/install.log
